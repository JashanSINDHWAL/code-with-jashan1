<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Mouse Tracker</title>
</head>
<body>
  <section id="tracker">
    <div class="proposal-card">
      <div id="question">
      </div>
      <button id="yesBtn">
        <span>😍</span>
        <span>Yes</span>
      </button>
      <button class="escape-btn">
        <span>🥺</span>
        <span>No</span>
      </button>
    </div>
  </section>

  <!-- ===========================
     Celebration Screen
=========================== -->

<section id="celebration">
    <div class="hearts"></div>
    <div class="left-balloons"></div>
    <div class="right-balloons"></div>
    <div id="successImage"></div>
</section>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>

</html>
